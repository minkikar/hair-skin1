{% extends 'base.html' %}

{% block title %}Login | Hair & Skin Admin{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Admin Login</h1>
    <form method="post" class="form">
        {% csrf_token %}
        <label>
            Username
            {{ form.username }}
        </label>
        <label>
            Password
            {{ form.password }}
        </label>
        <button type="submit" class="button primary">Sign in</button>
    </form>
</div>
{% endblock %}
